[project]
name = "tpp-mizan"
version = "0.1.0"
description = "A production-ready Python template featuring FastAPI REST API, Typer CLI, and structured JSON logging, managed by uv"
readme = "README.md"
license = { text = "MIT" }
keywords = ["template", "fastapi", "typer", "uv", "json-logging", "math"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
authors = [
    { name = "Mohammed El Hamraoui", email = "92893757+MohammedElHamraoui@users.noreply.github.com" },
]

dependencies = [
    "fastapi>=0.162.0",
    "python-dotenv>=1.2.4",
    "python-json-logger>=4.2.0,<5",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20261103",
    "httpx2>=2.16.0",
]

[project.scripts]
tpp-mizan = "tpp_mizan.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^tests/"]

# Only ignore missing imports for specific third-party libraries that lack stubs
[[tool.mypy.overrides]]
module = [
    "yaml",               # PyYAML (though types-pyyaml is installed, this is a safe fallback)
    "pythonjsonlogger.*", # python-json-logger
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["tpp_mizan"]
omit = ["*/tests/*"]

# Add this new section at the bottom:
[tool.coverage.report]
fail_under = 80 # <-- CI will fail if coverage drops below 80%
