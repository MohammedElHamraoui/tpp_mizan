[project]
name = "my-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed El Hamraoui", email = "92893757+MohammedElHamraoui@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "python-dotenv>=1.2.4",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
    "typer>=0.15.0",  # Changed from 0.28.0
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20261103",
    "httpx2>=2.16.0",
]

[project.scripts]
my-divide = "my_project.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
